name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: Lint (shared packages)
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm run test
